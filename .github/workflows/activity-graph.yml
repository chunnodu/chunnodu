name: Update activity graph

# Renders the README activity graph and force-pushes it as the only file on
# the `graph` branch, so `source` never gets bot commits.

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  graph:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Render graph
        run: |
          mkdir -p "$RUNNER_TEMP/graph"
          python scripts/activity_graph.py chunnodu "$RUNNER_TEMP/graph/activity-graph.svg" 31

      - name: Publish to graph branch
        working-directory: ${{ runner.temp }}/graph
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b graph
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add activity-graph.svg
          git commit -q -m "Update activity graph"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" graph
